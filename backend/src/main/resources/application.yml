server:
  port: 8080

spring:
  application:
    name: device-cms-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/device_cms
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  security:
    user:
      name: admin
      password: admin123

# JWT Configuration
jwt:
  secret: your-secret-key-here-make-it-long-and-secure
  expiration: 86400000 # 24 hours in milliseconds

# Logging
logging:
  level:
    com.cms: DEBUG
    org.springframework.security: DEBUG 